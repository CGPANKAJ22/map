<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Map</title>
<!--
  Dukaan ka ek hi map link: iPhone par Apple Maps, Android (aur baaki) par Google Maps.
  Link aisa: index.html?l=23.044244,82.419177&n=Dukaan%20ka%20naam&g=https%3A%2F%2Fmaps.app.goo.gl%2Fxxxx
    l = location (lat,lng)   n = naam (map par)   g = Google Maps link (optional)
  Ye page koi data nahi rakhta; sab kuch link me hi aata hai. Bot ye link khud banata hai.
-->
<style>
  :root { --bg:#f2f6ff; --card:#fff; --ink:#0f1d3d; --muted:#5a6785; --brand:#1e4fd8; --accent:#c9661a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1424; --card:#16203a; --ink:#e8eefc; --muted:#9aa8c7; --brand:#6d93ff; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans Devanagari',sans-serif; background:var(--bg); color:var(--ink); }
  .card { width:100%; max-width:380px; background:var(--card); border-radius:18px; padding:26px 22px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.12); }
  .pin { font-size:46px; line-height:1; }
  h1 { font-size:20px; margin:12px 0 4px; }
  p { margin:0 0 18px; color:var(--muted); font-size:15px; }
  a.btn { display:block; padding:14px; border-radius:12px; margin-top:10px; font-weight:700; font-size:16px; text-decoration:none; }
  a.main { background:var(--brand); color:#fff; }
  a.alt { border:2px solid var(--brand); color:var(--brand); }
  .err { color:var(--accent); }
</style>
</head>
<body>
<div class="card">
  <div class="pin">📍</div>
  <h1 id="name">Map</h1>
  <p id="msg">Map khul raha hai… / Opening map…</p>
  <a class="btn main" id="b1" href="#">Map kholein</a>
  <a class="btn alt" id="b2" href="#"></a>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var ll = (q.get('l') || '').replace(/\s/g, '');
  var name = (q.get('n') || '').slice(0, 80);
  var g = q.get('g') || '';
  var ok = /^-?\d{1,2}(\.\d+)?,-?\d{1,3}(\.\d+)?$/.test(ll);
  // Sirf Google Maps ke link par hi bhejo (kisi aur site par nahi)
  if (!/^https:\/\/(maps\.app\.goo\.gl|goo\.gl\/maps|(www\.)?google\.[a-z.]+\/maps|maps\.google\.[a-z.]+)\//i.test(g)) g = '';
  if (name) { document.getElementById('name').textContent = name; document.title = name + ' - Map'; }
  if (!ok && !g) { document.getElementById('msg').innerHTML = '<span class="err">Link adhoora hai / Link is incomplete</span>'; document.getElementById('b1').style.display = 'none'; document.getElementById('b2').style.display = 'none'; return; }

  var google = g || ('https://www.google.com/maps/search/?api=1&query=' + ll);
  var apple = ok ? ('https://maps.apple.com/?ll=' + ll + '&q=' + encodeURIComponent(name || 'Location'))
                 : ('https://maps.apple.com/?q=' + encodeURIComponent(name || ''));
  var ua = navigator.userAgent || '';
  var ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var first = ios ? apple : google;

  var b1 = document.getElementById('b1'), b2 = document.getElementById('b2');
  b1.href = first; b1.textContent = ios ? 'Apple Maps me kholein' : 'Google Maps me kholein';
  b2.href = ios ? google : apple; b2.textContent = ios ? 'Google Maps me kholein' : 'Apple Maps me kholein';
  setTimeout(function () { location.replace(first); }, 150);
})();
</script>
</body>
</html>
